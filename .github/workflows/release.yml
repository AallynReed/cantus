name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Work out the version
        run: |
          crate="$(cargo pkgid -p cantus-app | sed 's/.*[#@]//')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "${GITHUB_REF_NAME#v}" = "$crate"
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=v$crate-dev" >> "$GITHUB_ENV"
          fi
          echo "NUMBER=$crate" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CANTUS_ACOUSTID_KEY: ${{ secrets.ACOUSTID_KEY }}
      - name: Package
        run: |
          name="cantus-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/cantus.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/cantus" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          iscc "/DAppVersion=$NUMBER" "/DBinary=../../target/${{ matrix.target }}/release/cantus.exe" \
            "/DOutputName=cantus-${VERSION}-${{ matrix.target }}-setup" packaging/windows/cantus.iss
      - name: Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp "target/${{ matrix.target }}/release/cantus" AppDir/usr/bin/
          cp packaging/linux/cantus.desktop AppDir/
          cp packaging/icon.png AppDir/cantus.png
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/cantus" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "cantus-${VERSION}-${{ matrix.target }}.AppImage"
      - name: macOS app bundle
        if: runner.os == 'macOS'
        run: |
          app=Cantus.app/Contents
          mkdir -p "$app/MacOS"
          cp "target/${{ matrix.target }}/release/cantus" "$app/MacOS/"
          sed "s/VERSION/$NUMBER/g" packaging/macos/Info.plist > "$app/Info.plist"
          ditto -c -k --keepParent Cantus.app "cantus-${VERSION}-${{ matrix.target }}.app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            cantus-*.zip
            cantus-*.tar.gz
            cantus-*.exe
            cantus-*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum cantus-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \[" v "\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
