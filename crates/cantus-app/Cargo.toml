[package]
name = "cantus-app"
description = "Desktop music library manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cantus"
path = "src/main.rs"

[dependencies]
cantus-core = { path = "../cantus-core" }
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
rfd = "0.17.2"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
tempfile = "3.27.0"

[lints]
workspace = true
