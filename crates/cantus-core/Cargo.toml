[package]
name = "cantus-core"
description = "Library logic for Cantus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
data-encoding = "2.11.1"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
lofty = "0.25.5"
reqwest = { version = "0.13.5", features = ["blocking", "form", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rusty-chromaprint = "0.3.0"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
